name: CI/CD Pipeline

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    release:
        types: [ published ]
    workflow_dispatch:

permissions:
    contents: read
    packages: write
    id-token: write
    pages: write

jobs:
    pipeline:
        uses: oberon-oss/github-workflows/.github/workflows/maven-pipeline.yml@25e228ffce29fa809f9de1302f0b229f2f6c8d03
        with:
            java-version: '25'
            profiles: 'lombok,jacoco'
            deploy-profiles: 'lombok,deploy-to-nexus'
        secrets:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
            NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}